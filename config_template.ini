[common]
; 注意：Cookie 仅存储在独立的 cookies.txt 中，切勿将长 Cookie 写入本配置文件
use_cookies=false
username=
password=

; 要学习的课程ID列表，英文逗号分隔（留空则学习全部课程）
course_list=

; 视频播放倍速（1.0 ~ 2.0）
speed=1.0

; 同时进行的章节数量
jobs=4

; 遇到关闭任务点时的行为: retry-重试(默认), continue-继续
notopen_action=retry

[tiku]
; 仅保留 OpenAI 兼容 AI 大模型答题（支持 DeepSeek 与图文混合题目）
provider=AI

; 是否在启动时检查大模型连接可用性
check_llm_connection=true

; 是否提交答题：true=达到覆盖率后自动提交，false=仅保存
submit=true

; 最低答题覆盖率（0~1）
cover_rate=0.9

; 每次答题请求间隔（秒）
delay=1.0

; 是否启用本地答题缓存 cache.json
use_cache=true

; OpenAI 兼容接口配置（默认示例为 DeepSeek）
endpoint=https://api.deepseek.com/v1
key=
model=deepseek-chat
min_interval_seconds=3
http_proxy=

; 判断题映射词
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确

[notification]
provider=ServerChan
url=
tg_chat_id=
